---
# shellprocess-nexus.conf
# Ejecutar scripts de post-instalación de Nexus OS

i18n:
    name: "Optimizando Nexus OS para tu hardware..."

timeout: 600
script:
    - "/usr/local/bin/hardware_detect.sh"
    - "/usr/local/bin/adaptive_install.sh"
    - "/usr/local/bin/wine_setup.sh"
    - "/usr/local/bin/install_ai.sh"
    - "/usr/local/bin/vm_windows.sh"
